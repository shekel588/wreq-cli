name: Size Test (branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size-test:
    name: Build cut-features exe and report size
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Report size and smoke-test
        shell: pwsh
        run: |
          $exe = Get-Item target\release\wreq.exe
          "CUT_EXE_SIZE=$($exe.Length)" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          Write-Host "=== cut-features exe: $($exe.Length) bytes (baseline main: 6424576) ==="
          Write-Host "--- --version ---"; .\target\release\wreq.exe --version
          Write-Host "--- banner (no args) ---"; .\target\release\wreq.exe
          Write-Host "--- -I https ---"; .\target\release\wreq.exe -I https://example.com
          Write-Host "--- -e firefox -I (emulation intact) ---"; .\target\release\wreq.exe -e firefox -I https://example.com