[package]
name = "wreq-cli"
version = "0.3.0"
edition = "2021"
description = "Fast stealth HTTP client with browser TLS & HTTP/2 impersonation"

[[bin]]
name = "wreq"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wreq = { git = "https://github.com/0x676e67/wreq", branch = "main", features = ["tokio-rt", "gzip", "brotli", "zstd", "json", "cookies", "form", "multipart", "chromium-roots"] }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", branch = "main", features = ["emulation", "emulation-serde", "emulation-chromium-pki", "emulation-compression"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", branch = "main" }
btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
btls-sys = { git = "https://github.com/0x676e67/btls", branch = "main" }
tokio-btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
