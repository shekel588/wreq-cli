[package]
name = "wreq-cli"
version = "6.0.0-rc.31.3"
edition = "2021"
description = "Fast stealth HTTP client with browser TLS & HTTP/2 impersonation"

[[bin]]
name = "wreq"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
wreq = { git = "https://github.com/0x676e67/wreq", branch = "main", default-features = false, features = ["tokio-rt", "gzip", "brotli", "zstd", "deflate", "socks", "cookies", "form", "multipart", "chromium-roots"] }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", branch = "main", default-features = false, features = ["emulation", "emulation-chromium-pki", "emulation-compression"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", branch = "main" }
btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
btls-sys = { git = "https://github.com/0x676e67/btls", branch = "main" }
tokio-btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
