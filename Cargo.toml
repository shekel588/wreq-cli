[package]
name = "wreq-cli"
version = "0.2.0"
edition = "2021"
description = "High-performance stealth HTTP client CLI using wreq & BoringSSL with host OS matching"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wreq = { version = "0.16.1", features = ["tokio-rt", "gzip", "brotli", "zstd", "json", "cookies", "form", "multipart"] }
wreq-util = { version = "0.2.0", features = ["emulation"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
